<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Operator App</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #f4efe3 0%, #ece9de 100%);
        color: #182218;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .shell {
        width: min(440px, calc(100vw - 32px));
        padding: 28px;
        border-radius: 24px;
        background: rgba(255, 253, 247, 0.92);
        box-shadow: 0 24px 64px rgba(24, 34, 24, 0.12);
      }

      h1 {
        margin: 8px 0 10px;
        font-size: 1.8rem;
      }

      p {
        margin: 0 0 16px;
        color: rgba(24, 34, 24, 0.72);
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.92rem;
      }

      input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid rgba(24, 34, 24, 0.14);
        font: inherit;
      }

      button {
        margin-top: 16px;
        border: none;
        border-radius: 999px;
        padding: 12px 18px;
        background: #163c38;
        color: #fff8ef;
        font: inherit;
        cursor: pointer;
      }

      .hint {
        margin-top: 12px;
        font-size: 0.88rem;
      }

      .status {
        margin-top: 12px;
        min-height: 1.25rem;
        color: #8a2d0b;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div>Enterprise Resilience Agent</div>
      <h1>Connect the operator app</h1>
      <p>Enter the dashboard URL you want this desktop app to open.</p>
      <form id="config-form">
        <label for="target-url">Dashboard URL</label>
        <input id="target-url" name="target-url" placeholder="http://127.0.0.1:8080/overview" />
        <button type="submit">Save and open</button>
        <div class="hint">Use `/overview` for the main dashboard or any other page you prefer.</div>
        <div id="status" class="status"></div>
      </form>
    </main>
    <script type="module">
      const form = document.getElementById("config-form");
      const input = document.getElementById("target-url");
      const status = document.getElementById("status");

      const config = await window.eraOperator.getConfig();
      input.value = config.targetUrl ?? "http://127.0.0.1:8080/overview";

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        try {
          const url = new URL(input.value);
          await window.eraOperator.saveConfig(url.toString());
          status.textContent = "Opening dashboard...";
        } catch (error) {
          status.textContent = error instanceof Error ? error.message : "Enter a valid URL.";
        }
      });
    </script>
  </body>
</html>
